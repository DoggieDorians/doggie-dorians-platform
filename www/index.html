<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doggie Dorian’s</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #08111d;
      color: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.5;
      color: #d8e2ef;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: #d6b36a;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Doggie Dorian’s</h1>
    <p>Mobile app preview is ready.</p>
    <a class="btn" href="https://dorianspetcare.com">Open Live Site</a>
  </div>
</body>
</html>
